name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - 'r[0-9]+.[0-9]+.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changelog:
    name: Release readiness
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release branch version and notes
        env:
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
          BASE_BRANCH: ${{ github.base_ref || 'main' }}
        run: python3 workout-logger/scripts/check_release_readiness.py --branch "$SOURCE_BRANCH" --base-ref "origin/$BASE_BRANCH"
      - run: python3 workout-logger/scripts/build_release_notes.py --check
      - run: python3 -m unittest discover -s workout-logger/scripts -p 'test_*.py'

  security_scan:
    name: Security & Secret Scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  quality_and_metrics:
    timeout-minutes: 20
    name: Code Quality, Complexity & Architecture
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Flutter
        id: flutter-action
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: './workout-logger/pubspec.yaml'
          channel: 'stable'
          cache: true
          pub-cache-key: "flutter-pub-:os:-:channel:-:version:-:arch:-${{ hashFiles('workout-logger/pubspec.lock') }}"

      - name: Install dependencies
        working-directory: ./workout-logger
        run: flutter pub get --enforce-lockfile

      - name: Flutter Analyze
        working-directory: ./workout-logger
        run: |
          set -o pipefail
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings | tee analyze_output.txt
          SUMMARY=$(tail -n 1 analyze_output.txt)
          echo "Analysis Summary: $SUMMARY"
          echo "### Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo "$SUMMARY" >> $GITHUB_STEP_SUMMARY

      - name: Dart Code Linter (Metrics & Complexity)
        working-directory: ./workout-logger
        run: dart run dart_code_linter:metrics analyze lib --reporter=github --no-fatal-warnings --no-fatal-style

      - name: Check Unused Files
        working-directory: ./workout-logger
        run: dart run dart_code_linter:metrics check-unused-files lib --no-fatal-unused

      - name: Check Unused Code
        working-directory: ./workout-logger
        run: dart run dart_code_linter:metrics check-unused-code lib --no-fatal-unused

      - name: Architecture Linting (custom_lint)
        working-directory: ./workout-logger
        run: dart run custom_lint --no-fatal-warnings

  test_and_coverage:
    timeout-minutes: 20
    name: Tests & Coverage
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Flutter
        id: flutter-action
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: './workout-logger/pubspec.yaml'
          channel: 'stable'
          cache: true
          pub-cache-key: "flutter-pub-:os:-:channel:-:version:-:arch:-${{ hashFiles('workout-logger/pubspec.lock') }}"

      - name: Install dependencies
        working-directory: ./workout-logger
        run: flutter pub get --enforce-lockfile

      - name: Run tests with coverage
        working-directory: ./workout-logger
        run: flutter test --coverage --no-pub

      - name: Upload visual regression failures
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          compression-level: 0
          name: exercise-visual-failures
          path: workout-logger/test/failures/**/*.png
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: workout-logger/coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Devasy/RepForge

  android_dry_run:
    timeout-minutes: 25
    env:
      GRADLE_OPTS: -Dorg.gradle.caching=true
    name: Android Build Verification (Dry Run)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version: '21'
          problem-matcher: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: './workout-logger/pubspec.yaml'
          channel: 'stable'
          cache: true
          pub-cache-key: "flutter-pub-:os:-:channel:-:version:-:arch:-${{ hashFiles('workout-logger/pubspec.lock') }}"

      - name: Select CI Java runtime
        run: flutter config --jdk-dir="$JAVA_HOME"

      - name: Install dependencies
        working-directory: ./workout-logger
        run: |
          flutter pub get --enforce-lockfile
          : "${PUB_CACHE:?PUB_CACHE is not set}"
          mapfile -t targets < <(find "$PUB_CACHE" -type f -path '*/jni-*/src/CMakeLists.txt')
          for f in "${targets[@]}"; do
            if ! grep -q -- '-Wl,--build-id=none' "$f"; then
              sed -i -e 's/-Wl,/-Wl,--build-id=none,/' "$f"
            fi
          done

      - name: Build Debug App Bundle (Dry Run)
        working-directory: ./workout-logger
        run: flutter build appbundle --debug --no-pub

      - name: Build installable debug APK
        working-directory: ./workout-logger
        run: flutter build apk --debug --no-pub

      - name: Verify separate debug app identity
        run: |
          APK=workout-logger/build/app/outputs/flutter-apk/app-debug.apk
          BADGING=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK")
          echo "$BADGING" | grep -F "package: name='com.devasy.repforge.debug'"
          echo "$BADGING" | grep -F "application-label:'RepForge (Debug)'"

      - name: Upload installable debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          archive: true
          compression-level: 0
          name: RepForge-Debug-${{ github.event.pull_request.head.sha || github.sha }}
          path: workout-logger/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Verify release shrinking rules
        if: github.event_name != 'push'
        working-directory: ./workout-logger
        run: flutter build apk --release --split-per-abi --target-platform android-arm64 --no-pub

      - name: Verify release APK identity and ABI version code
        if: github.event_name != 'push'
        run: |
          FULL_VERSION=$(sed -n 's/^version: //p' workout-logger/pubspec.yaml | tr -d '\r')
          EXPECTED_CODE=$((${FULL_VERSION##*+} * 10 + 2))
          APK=workout-logger/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          BADGING=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK")
          echo "$BADGING" | grep -F "package: name='com.devasy.repforge'"
          echo "$BADGING" | grep -F "versionName='${FULL_VERSION%%+*}'"
          echo "$BADGING" | grep -F "versionCode='$EXPECTED_CODE'"
