name: CI

on:
  push:
    branches:
      - main
      - 'r[0-9]+.[0-9]+.*'
  pull_request:
    branches:
      - main
      - 'r[0-9]+.[0-9]+.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changelog:
    name: Changelog format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 workout-logger/scripts/build_release_notes.py --check
      - run: python3 -m unittest discover -s workout-logger/scripts -p 'test_*.py'

  security_scan:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4

  quality_and_metrics:
    name: Code Quality, Complexity & Architecture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        id: flutter-action
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: './workout-logger/pubspec.yaml'
          channel: 'stable'
          cache: true
          pub-cache-key: "flutter-pub-:os:-:channel:-:version:-:arch:-${{ hashFiles('workout-logger/pubspec.lock') }}"

      - name: Install dependencies
        working-directory: ./workout-logger
        run: flutter pub get

      - name: Flutter Analyze
        working-directory: ./workout-logger
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings | tee analyze_output.txt
          SUMMARY=$(tail -n 1 analyze_output.txt)
          echo "Analysis Summary: $SUMMARY"
          echo "### Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo "$SUMMARY" >> $GITHUB_STEP_SUMMARY

      - name: Dart Code Linter (Metrics & Complexity)
        working-directory: ./workout-logger
        run: dart run dart_code_linter:metrics analyze lib --reporter=github --no-fatal-warnings --no-fatal-style

      - name: Check Unused Files
        working-directory: ./workout-logger
        run: dart run dart_code_linter:metrics check-unused-files lib --no-fatal-unused

      - name: Check Unused Code
        working-directory: ./workout-logger
        run: dart run dart_code_linter:metrics check-unused-code lib --no-fatal-unused

      - name: Architecture Linting (custom_lint)
        working-directory: ./workout-logger
        run: dart run custom_lint --no-fatal-warnings

  test_and_coverage:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        id: flutter-action
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: './workout-logger/pubspec.yaml'
          channel: 'stable'
          cache: true
          pub-cache-key: "flutter-pub-:os:-:channel:-:version:-:arch:-${{ hashFiles('workout-logger/pubspec.lock') }}"

      - name: Install dependencies
        working-directory: ./workout-logger
        run: flutter pub get

      - name: Run tests with coverage
        working-directory: ./workout-logger
        run: flutter test --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: workout-logger/coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Devasy/RepForge

  android_dry_run:
    name: Android Build Verification (Dry Run)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: './workout-logger/pubspec.yaml'
          channel: 'stable'
          cache: true
          pub-cache-key: "flutter-pub-:os:-:channel:-:version:-:arch:-${{ hashFiles('workout-logger/pubspec.lock') }}"

      - name: Install dependencies
        working-directory: ./workout-logger
        run: |
          flutter pub get --enforce-lockfile
          : "${PUB_CACHE:?PUB_CACHE is not set}"
          mapfile -t targets < <(find "$PUB_CACHE" -type f -path '*/jni-*/src/CMakeLists.txt')
          for f in "${targets[@]}"; do
            if ! grep -q -- '-Wl,--build-id=none' "$f"; then
              sed -i -e 's/-Wl,/-Wl,--build-id=none,/' "$f"
            fi
          done

      - name: Build Debug App Bundle (Dry Run)
        working-directory: ./workout-logger
        run: flutter build appbundle --debug --no-pub

      - name: Build installable debug APK
        working-directory: ./workout-logger
        run: flutter build apk --debug --no-pub

      - name: Verify separate debug app identity
        run: |
          APK=workout-logger/build/app/outputs/flutter-apk/app-debug.apk
          BADGING=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK")
          echo "$BADGING" | grep -F "package: name='com.devasy.repforge.debug'"
          echo "$BADGING" | grep -F "application-label:'RepForge (Debug)'"

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RepForge-Debug-${{ github.event.pull_request.head.sha || github.sha }}
          path: workout-logger/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Verify release shrinking rules
        if: github.event_name == 'pull_request'
        working-directory: ./workout-logger
        run: flutter build apk --release --split-per-abi --target-platform android-arm64 --no-pub
