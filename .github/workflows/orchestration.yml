name: Orchestration packages

on:
  pull_request:
    paths:
      - 'packages/ai_orchestration/**'
      - 'packages/ai_orchestration_sqlite/**'
      - 'packages/ai_orchestration_flutter/**'
      - 'packages/ai_orchestration_gemini/**'
      - '.github/workflows/orchestration.yml'
  push:
    branches: [main]
    paths:
      - 'packages/ai_orchestration/**'
      - 'packages/ai_orchestration_sqlite/**'
      - 'packages/ai_orchestration_flutter/**'
      - 'packages/ai_orchestration_gemini/**'
      - '.github/workflows/orchestration.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    timeout-minutes: 15
    env:
      PUB_CACHE: ${{ github.workspace }}/.dart_tool/pub-cache
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
        package: [ai_orchestration, ai_orchestration_sqlite, ai_orchestration_gemini]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1.8.2
        with:
          sdk: '3.14.0'
      - name: Cache Dart packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PUB_CACHE }}
          key: dart-pub-${{ runner.os }}-3.14.0-${{ matrix.package }}-${{ hashFiles('packages/**/pubspec.yaml') }}
          restore-keys: dart-pub-${{ runner.os }}-3.14.0-${{ matrix.package }}-
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test
      - name: Run domain example
        if: matrix.package == 'ai_orchestration'
        run: dart run example/expense_agent.dart
      - name: Run SQLite example
        if: matrix.package == 'ai_orchestration_sqlite'
        run: dart run example/task_assistant.dart

  flutter-bridge:
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/ai_orchestration_flutter
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.50.0'
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --no-pub --fatal-infos
      - run: flutter test --no-pub
