name: Release Build & Deploy

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, Release & Deploy
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04

    env:
      LDFLAGS: -Wl,--build-id=none

    permissions:
      contents: write      # Required to create releases and push commits
      pull-requests: read  # Required to read merged PRs for release notes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper versioning
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Build Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: './workout-logger/pubspec.yaml'
          channel: 'stable'
          cache: true
          pub-cache-key: "flutter-pub-:os:-:channel:-:version:-:arch:-${{ hashFiles('workout-logger/pubspec.lock') }}"

      - name: Install dependencies
        working-directory: ./workout-logger
        run: |
          flutter pub get --enforce-lockfile
          : "${PUB_CACHE:?PUB_CACHE is not set}"
          mapfile -t targets < <(find "$PUB_CACHE" -type f -path '*/jni-*/src/CMakeLists.txt')
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "Error: JNI CMakeLists.txt not found in PUB_CACHE" >&2
            exit 1
          fi
          for f in "${targets[@]}"; do
            if ! grep -q -- '-Wl,--build-id=none' "$f"; then
              sed -i -e 's/-Wl,/-Wl,--build-id=none,/' "$f"
            fi
          done

      - name: Bump version
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        id: bump_version
        run: |
          dart scripts/bump_version.dart patch
          FULL_VERSION=$(sed -n 's/^version: //p' workout-logger/pubspec.yaml | tr -d '\r')
          BUILD_NUMBER=${FULL_VERSION##*+}
          if (( BUILD_NUMBER < GITHUB_RUN_NUMBER )); then
            sed -i "s/^version: .*/version: ${FULL_VERSION%%+*}+${GITHUB_RUN_NUMBER}/" workout-logger/pubspec.yaml
          fi

      - name: Read version
        id: version
        run: |
          FULL_VERSION=$(sed -n 's/^version: //p' workout-logger/pubspec.yaml | tr -d '\r')
          [[ "$FULL_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]
          VERSION=${FULL_VERSION%%+*}
          BUILD_NUMBER=${FULL_VERSION##*+}
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v${VERSION}" ]]; then
            echo "Error: release tag does not match pubspec.yaml" >&2
            exit 1
          fi
          echo "value=$VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT

      - name: Configure Git
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit version bump
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        id: commit_version
        run: |
          git add workout-logger/pubspec.yaml
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "committed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore: bump version to ${{ steps.version.outputs.value }}"
            git push origin HEAD:${{ github.ref_name }}
            echo "committed=true" >> $GITHUB_OUTPUT
          fi
          echo "commit=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Create Git tag
        if: github.event_name == 'push' && steps.commit_version.outputs.committed == 'true'
        run: |
          git tag "v${{ steps.version.outputs.value }}"
          git push origin "v${{ steps.version.outputs.value }}"

      - name: Get merged PRs for release notes
        if: steps.commit_version.outputs.committed == 'true' || startsWith(github.ref, 'refs/tags/')
        id: merged_prs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_TAG="v${{ steps.version.outputs.value }}"
          PREV_TAG=$(git tag --sort=-version:refname | grep '^v' | grep -v "^${NEW_TAG}$" | head -1)

          if [ -n "$PREV_TAG" ]; then
            SINCE_DATE=$(git log -1 --format=%aI "$PREV_TAG")
            PR_LIST=$(gh pr list \
              --state merged \
              --base main \
              --limit 50 \
              --search "merged:>=${SINCE_DATE}" \
              --json number,title,author \
              --template '{{range .}}- #{{.number}} {{.title}} (@{{.author.login}}){{"\n"}}{{end}}' 2>/dev/null || echo "")
          else
            PR_LIST=$(gh pr list \
              --state merged \
              --base main \
              --limit 10 \
              --json number,title,author \
              --template '{{range .}}- #{{.number}} {{.title}} (@{{.author.login}}){{"\n"}}{{end}}' 2>/dev/null || echo "")
          fi

          [ -z "$PR_LIST" ] && PR_LIST="_No merged pull requests found since the last release._"

          {
            echo "list<<EOF"
            echo "$PR_LIST"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Decode release keystore
        id: decode_keystore
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Error: KEYSTORE_BASE64 secret is not configured in repository secrets."
            exit 1
          fi
          KEYSTORE_FILE="${{ runner.temp }}/upload-keystore.jks"
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\r\n ' | base64 -d > "$KEYSTORE_FILE"
          echo "keystore_path=$KEYSTORE_FILE" >> $GITHUB_OUTPUT

      - name: Build Release App Bundle (.aab)
        working-directory: ./workout-logger
        env:
          KEYSTORE_PATH: ${{ steps.decode_keystore.outputs.keystore_path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.KEY_STORE_PASSWORD }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build appbundle --release --no-pub \
            --build-name=${{ steps.version.outputs.value }} \
            --build-number=${{ github.run_number }}

      - name: Build APKs (Split per ABI)
        working-directory: ./workout-logger
        env:
          KEYSTORE_PATH: ${{ steps.decode_keystore.outputs.keystore_path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.KEY_STORE_PASSWORD }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi --no-pub

      - name: Rename APKs
        run: |
          V="${{ steps.version.outputs.value }}"
          DIR="workout-logger/build/app/outputs/flutter-apk"
          for ABI_SPEC in armeabi-v7a:1 arm64-v8a:2 x86_64:3; do
            ABI=${ABI_SPEC%:*}
            EXPECTED_CODE=$((${{ steps.version.outputs.build_number }} * 10 + ${ABI_SPEC#*:}))
            APK="$DIR/app-${ABI}-release.apk"
            ACTUAL_CODE=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | sed -n "s/^package: .*versionCode='\([0-9]*\)'.*/\1/p")
            if [[ "$ACTUAL_CODE" != "$EXPECTED_CODE" ]]; then
              echo "Error: ${ABI} APK has version code ${ACTUAL_CODE}, expected ${EXPECTED_CODE}" >&2
              exit 1
            fi
            mv "$APK" "$DIR/repforge-v${V}-${ABI}.apk"
          done

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: repforge-v${{ steps.version.outputs.value }}-b${{ github.run_number }}-aab
          path: workout-logger/build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Sanitize ref name for artifact
        if: github.event_name == 'workflow_dispatch'
        id: sanitize_ref
        run: echo "ref_name=$(echo '${{ github.ref_name }}' | tr '/' '-')" >> $GITHUB_OUTPUT

      - name: Upload APK artifact (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: repforge-v${{ steps.version.outputs.value }}-${{ steps.sanitize_ref.outputs.ref_name }}
          path: workout-logger/build/app/outputs/flutter-apk/repforge-v${{ steps.version.outputs.value }}-*.apk
          retention-days: 7

      - name: Deploy to Google Play (Closed Testing Track)
        if: github.event_name == 'push' && env.PLAY_STORE_JSON_KEY != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.devasy.repforge
          releaseFiles: workout-logger/build/app/outputs/bundle/release/app-release.aab
          track: alpha
          status: completed
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}

      - name: Google Play notice (when secret missing)
        if: env.PLAY_STORE_JSON_KEY == ''
        run: echo "::warning::PLAY_STORE_JSON_KEY is not configured; skipped Google Play deployment."
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}

      - name: Create GitHub Release
        if: github.event_name == 'push' && (steps.commit_version.outputs.committed == 'true' || startsWith(github.ref, 'refs/tags/'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: RepForge v${{ steps.version.outputs.value }}
          body: |
            ## RepForge v${{ steps.version.outputs.value }}

            ### 📱 Download
            Download the APK file below to install on your Android device.

            ### 🔀 Merged Pull Requests
            ${{ steps.merged_prs.outputs.list }}

            ### 📊 Build Information
            - **Version**: ${{ steps.version.outputs.value }}
            - **APK Base Version Code**: ${{ steps.version.outputs.build_number }}
            - **Play AAB Version Code**: ${{ github.run_number }}
            - **Commit**: ${{ steps.commit_version.outputs.commit || github.sha }}
          files: |
            workout-logger/build/app/outputs/flutter-apk/repforge-v${{ steps.version.outputs.value }}-*.apk
            workout-logger/build/app/outputs/bundle/release/app-release.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up Keystore
        if: always()
        run: |
          rm -f "${{ runner.temp }}/upload-keystore.jks"
