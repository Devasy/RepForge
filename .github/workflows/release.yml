name: Release Build & Deploy

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan protected-branch release
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: '3.13.2'
      - name: Validate notes and choose preparation or publication
        id: plan
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: python3 workout-logger/scripts/release_plan.py

  prepare:
    name: Prepare release pull request
    needs: plan
    if: needs.plan.outputs.mode == 'prepare'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: '3.13.2'
      - name: Prepare version on a release branch
        id: branch
        run: python3 workout-logger/scripts/prepare_release_branch.py "$VERSION" --build-floor "$GITHUB_RUN_NUMBER"
      - name: Open the release PR and explicitly dispatch its checks
        if: steps.branch.outputs.branch != ''
        env:
          RELEASE_BRANCH: ${{ steps.branch.outputs.branch }}
        run: |
          PR_NUMBER=$(gh pr list --base main --head "$RELEASE_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [[ -z "$PR_NUMBER" ]]; then
            cat > "$RUNNER_TEMP/release-pr-body.md" <<'NOTES'
          Prepare the already authored release version and build number through a protected pull request.

          Merge after the required checks pass. Merging this version change builds and publishes the exact merged commit; the release bot never pushes commits directly to main.
          NOTES
            gh pr create --base main --head "$RELEASE_BRANCH" --title "chore: release $VERSION" --body-file "$RUNNER_TEMP/release-pr-body.md"
          fi
          gh workflow run ci.yml --ref "$RELEASE_BRANCH"
          gh workflow run orchestration.yml --ref "$RELEASE_BRANCH"

  release:
    name: Build, Release & Deploy
    needs: plan
    if: needs.plan.outputs.mode == 'publish' || needs.plan.outputs.mode == 'verify'
    runs-on: ubuntu-24.04

    env:
      LDFLAGS: -Wl,--build-id=none

    permissions:
      contents: write      # Required to tag the checked commit and publish releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for proper versioning
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Build Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: './workout-logger/pubspec.yaml'
          channel: 'stable'
          cache: true
          pub-cache-key: "flutter-pub-:os:-:channel:-:version:-:arch:-${{ hashFiles('workout-logger/pubspec.lock') }}"

      - name: Check notes for the committed release version
        run: python3 workout-logger/scripts/check_release_readiness.py --current

      - name: Install dependencies
        working-directory: ./workout-logger
        run: |
          flutter pub get --enforce-lockfile
          : "${PUB_CACHE:?PUB_CACHE is not set}"
          mapfile -t targets < <(find "$PUB_CACHE" -type f -path '*/jni-*/src/CMakeLists.txt')
          if [ "${#targets[@]}" -eq 0 ]; then
            echo "Error: JNI CMakeLists.txt not found in PUB_CACHE" >&2
            exit 1
          fi
          for f in "${targets[@]}"; do
            if ! grep -q -- '-Wl,--build-id=none' "$f"; then
              sed -i -e 's/-Wl,/-Wl,--build-id=none,/' "$f"
            fi
          done

      - name: Read version
        id: version
        run: |
          FULL_VERSION=$(sed -n 's/^version: //p' workout-logger/pubspec.yaml | tr -d '\r')
          [[ "$FULL_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]
          VERSION=${FULL_VERSION%%+*}
          BUILD_NUMBER=${FULL_VERSION##*+}
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v${VERSION}" ]]; then
            echo "Error: release tag does not match pubspec.yaml" >&2
            exit 1
          fi
          echo "value=$VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT

      - name: Validate and extract CHANGELOG.md release notes
        run: python3 workout-logger/scripts/build_release_notes.py "${{ steps.version.outputs.value }}" > release-notes.md

      - name: Decode release keystore
        id: decode_keystore
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Error: KEYSTORE_BASE64 secret is not configured in repository secrets."
            exit 1
          fi
          KEYSTORE_FILE="${{ runner.temp }}/upload-keystore.jks"
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\r\n ' | base64 -d > "$KEYSTORE_FILE"
          echo "keystore_path=$KEYSTORE_FILE" >> $GITHUB_OUTPUT

      - name: Build Release App Bundle (.aab)
        working-directory: ./workout-logger
        env:
          KEYSTORE_PATH: ${{ steps.decode_keystore.outputs.keystore_path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.KEY_STORE_PASSWORD }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build appbundle --release --no-pub \
            --build-name=${{ steps.version.outputs.value }} \
            --build-number=${{ github.run_number }}

      - name: Build APKs (Split per ABI)
        working-directory: ./workout-logger
        env:
          KEYSTORE_PATH: ${{ steps.decode_keystore.outputs.keystore_path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.KEY_STORE_PASSWORD }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release --split-per-abi --no-pub

      - name: Rename APKs
        run: |
          V="${{ steps.version.outputs.value }}"
          DIR="workout-logger/build/app/outputs/flutter-apk"
          for ABI_SPEC in armeabi-v7a:1 arm64-v8a:2 x86_64:3; do
            ABI=${ABI_SPEC%:*}
            EXPECTED_CODE=$((${{ steps.version.outputs.build_number }} * 10 + ${ABI_SPEC#*:}))
            APK="$DIR/app-${ABI}-release.apk"
            ACTUAL_CODE=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | sed -n "s/^package: .*versionCode='\([0-9]*\)'.*/\1/p")
            if [[ "$ACTUAL_CODE" != "$EXPECTED_CODE" ]]; then
              echo "Error: ${ABI} APK has version code ${ACTUAL_CODE}, expected ${EXPECTED_CODE}" >&2
              exit 1
            fi
            mv "$APK" "$DIR/repforge-v${V}-${ABI}.apk"
          done

      - name: Tag the verified merged commit
        if: needs.plan.outputs.mode == 'publish' && !startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if git rev-parse --verify "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            [[ "$(git rev-parse "refs/tags/v${VERSION}^{commit}")" == "$GITHUB_SHA" ]] || { echo "Error: release tag points to another commit" >&2; exit 1; }
          else
            git tag "v${VERSION}" "$GITHUB_SHA"
            git push origin "refs/tags/v${VERSION}"
          fi

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: repforge-v${{ steps.version.outputs.value }}-b${{ github.run_number }}-aab
          path: workout-logger/build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Sanitize ref name for artifact
        if: github.event_name == 'workflow_dispatch'
        id: sanitize_ref
        run: echo "ref_name=$(echo '${{ github.ref_name }}' | tr '/' '-')" >> $GITHUB_OUTPUT

      - name: Upload APK artifact (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: repforge-v${{ steps.version.outputs.value }}-${{ steps.sanitize_ref.outputs.ref_name }}
          path: workout-logger/build/app/outputs/flutter-apk/repforge-v${{ steps.version.outputs.value }}-*.apk
          retention-days: 7

      - name: Deploy to Google Play (Closed Testing Track)
        if: needs.plan.outputs.mode == 'publish' && env.PLAY_STORE_JSON_KEY != ''
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_JSON_KEY }}
          packageName: com.devasy.repforge
          releaseFiles: workout-logger/build/app/outputs/bundle/release/app-release.aab
          track: alpha
          status: completed
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}

      - name: Google Play notice (when secret missing)
        if: env.PLAY_STORE_JSON_KEY == ''
        run: echo "::warning::PLAY_STORE_JSON_KEY is not configured; skipped Google Play deployment."
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}

      - name: Create GitHub Release
        if: needs.plan.outputs.mode == 'publish'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: RepForge v${{ steps.version.outputs.value }}
          body_path: release-notes.md
          files: |
            workout-logger/build/app/outputs/flutter-apk/repforge-v${{ steps.version.outputs.value }}-*.apk
            workout-logger/build/app/outputs/bundle/release/app-release.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up Keystore
        if: always()
        run: |
          rm -f "${{ runner.temp }}/upload-keystore.jks"
