name: Expo Preview

on:
  pull_request:

jobs:
  preview:
    name: Create and publish preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
          cache: 'npm'
          cache-dependency-path: workout-logger/package-lock.json

      - name: Set up Expo
        uses: expo/expo-github-action@v8
        with:
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Install dependencies
        run: npm install
        working-directory: ./workout-logger

      - name: Create preview
        id: preview
        uses: expo/expo-preview-action@v1
        with:
          channel: pr-${{ github.event.number }}
          project-flavor: 'expo-go'
        working-directory: ./workout-logger

      - name: Add comment to PR
        uses: unsplash/comment-on-pr@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          pr-number: ${{ github.event.number }}
          message: |
            A preview of this pull request is available.

            **Project Page:** [Open](${{ steps.preview.outputs.EXPO_PROJECT_URL }})
            **Manifest URL:** `${{ steps.preview.outputs.EXPO_MANIFEST_URL }}`

            Scan the QR code below with the Expo Go app to view the preview:
            <a href="${{ steps.preview.outputs.EXPO_PROJECT_URL }}"><img src="${{ steps.preview.outputs.EXPO_QR_CODE_URL }}" width="250px" height="250px" /></a>

            ---
            *Note: You will need to create an `EXPO_TOKEN` secret in your repository settings for this workflow to succeed.*
