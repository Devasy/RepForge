# Codecov Configuration for RepForge (Devasy/RepForge)
codecov:
  require_ci_to_pass: yes

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: auto

ignore:
  - "**/*.g.dart"
  - "**/*.freezed.dart"
  - "workout-logger/test/**/*"
