name: repforge
description: "RepForge - Your personal workout companion to forge strength and track progress."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 2.1.2+36

environment:
  sdk: ^3.11.4
  flutter: 3.47.2

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  
  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # SQLite persistence (replacing Hive)
  sqflite: ^2.4.4

  # State management
  provider: ^6.1.1
  
  # Charts for visualization
  fl_chart: ^1.2.0
  
  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.3
  http: ^1.2.1
  package_info_plus: ^10.2.1

  # Health Connect integration
  health_connector: ^3.11.1

  # AI — Gemini
  google_generative_ai: ^0.4.3

  # Backup export/import
  file_picker: 12.0.0-beta.7
  path_provider: ^2.1.5
  share_plus: ^13.2.1
  gpt_markdown: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  dart_code_linter: ^3.2.1
  custom_lint: ^0.8.1
  awesome_lints: ^2.2.0
  
  # Testing
  mockito: ^5.4.4
  build_runner: ^2.4.8

  # sqflite testing on the Dart VM (flutter test has no platform binding)
  sqflite_common_ffi: ^2.4.3

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true


  fonts:
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Variable.ttf
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono-Variable.ttf

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/repforge_icon.png"
  adaptive_icon_background: "#00D4FF"
